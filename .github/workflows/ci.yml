name: CI

# Every job here is required to merge (OB-1-02 §5). A failing sanitizer does not
# merge — that is the deal we made when we chose C++ (NFR-08, D2, R4).

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.44.4

jobs:
  engine:
    name: engine (${{ matrix.build_type }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S engine -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
      - name: Build
        run: cmake --build build -j3
      - name: Test
        run: ctest --test-dir build --output-on-failure

  engine-windows:
    name: engine (Windows)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      # The release is the only other thing that compiles the Windows sources,
      # and finding a portability break there means finding it after the tag is
      # already pushed. This job builds exactly what the release builds.
      - name: Configure
        run: cmake -S engine -B build-windows -A x64 -DONEBEAT_BUILD_TESTS=OFF -DONEBEAT_WERROR=OFF
      - name: Build
        run: cmake --build build-windows --config Release --target onebeat_engine --parallel 3

  sanitizers:
    name: ${{ matrix.name }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: asan+ubsan
            flags: -DONEBEAT_ASAN=ON
            needs_llvm: false
          - name: tsan
            flags: -DONEBEAT_TSAN=ON
            needs_llvm: false
          # RealtimeSanitizer needs LLVM >= 20; Xcode's clang does not ship it.
          # It is installed rather than skipped: RTSan is the check that proves
          # the audio thread never allocates or locks (FR-ENG-03).
          - name: rtsan
            flags: -DONEBEAT_RTSAN=ON
            needs_llvm: true
    steps:
      - uses: actions/checkout@v4
      - name: Set up LLVM (RTSan)
        if: matrix.needs_llvm
        uses: ./.github/actions/setup-llvm
      - name: Configure
        run: |
          EXTRA=""
          if [ "${{ matrix.needs_llvm }}" = "true" ]; then
            EXTRA="-DCMAKE_CXX_COMPILER=$LLVM_PREFIX/bin/clang++ -DCMAKE_C_COMPILER=$LLVM_PREFIX/bin/clang"
          fi
          cmake -S engine -B build-san -DCMAKE_BUILD_TYPE=Debug ${{ matrix.flags }} $EXTRA
      - name: Build
        run: cmake --build build-san -j3
      - name: Test
        run: ctest --test-dir build-san --output-on-failure
        env:
          # Leaks are checked by the dedicated stress test; the default detector
          # trips on Flutter/CoreAudio statics that are not ours.
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          TSAN_OPTIONS: halt_on_error=1
          RTSAN_OPTIONS: halt_on_error=1

  app:
    name: app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Build engine
        run: |
          cmake -S engine -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build -j3
      - name: Pub get
        run: cd app && flutter pub get
      - name: Bindings are up to date
        # The generated bindings are checked in; regenerating must be a no-op.
        run: |
          cd app
          cp lib/src/engine/generated/onebeat_bindings.dart /tmp/bindings.before
          dart run ffigen --config ffigen.yaml
          diff -u /tmp/bindings.before lib/src/engine/generated/onebeat_bindings.dart \
            || (echo "Bindings are stale: run 'cd app && dart run ffigen --config ffigen.yaml'" && exit 1)
      - name: Analyze
        run: cd app && flutter analyze
      - name: Test
        run: cd app && flutter test
      - name: FFI smoke test (headless)
        run: cd app && OB_ENGINE_DYLIB=$GITHUB_WORKSPACE/build/libonebeat_engine.dylib dart run tool/engine_smoke.dart 3
      - name: Build macOS app
        run: cd app && flutter build macos --debug

  checks:
    name: lint and audit
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Seam check (platform code confinement, NFR-11)
        run: tools/seam_check.sh
      - name: Token lint (FR-UX-02)
        run: python3 tools/token_lint.py --verbose
      - name: Resolve Dart dependencies for the audit
        run: cd app && flutter pub get
      - name: Licence audit (NFR-09)
        run: python3 tools/license_audit.py --verbose
      # Xcode ships clang-format but not clang-tidy, so the lint job uses the
      # same Homebrew LLVM the RTSan job does — via the same action, so the two
      # jobs can never drift onto different compilers.
      - name: Set up LLVM
        uses: ./.github/actions/setup-llvm
      - name: clang-format
        # Parenthesised so -print applies to both branches. Without the parens
        # the precedence is (-name '*.cpp') -o (-name '*.h' -print), and half the
        # tree silently goes unchecked.
        run: |
          find engine \( -path '*/build*' -prune \) -o \( -name '*.cpp' -o -name '*.h' \) -print0 \
            | xargs -0 "$LLVM_PREFIX/bin/clang-format" --dry-run --Werror
      - name: clang-tidy
        # The compile database must be generated by the same toolchain that runs
        # clang-tidy. Mixing Apple clang's database with Homebrew clang-tidy
        # gives it the wrong resource directory, so it cannot find <atomic> and
        # then mis-parses everything downstream. run-clang-tidy also limits the
        # check to translation units in that database, avoiding Windows-only
        # sources on the macOS lint runner.
        run: |
          cmake -S engine -B build-tidy -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER="$LLVM_PREFIX/bin/clang++" \
            -DCMAKE_C_COMPILER="$LLVM_PREFIX/bin/clang"
          "$LLVM_PREFIX/bin/run-clang-tidy" -p build-tidy \
            -clang-tidy-binary "$LLVM_PREFIX/bin/clang-tidy" -j 3 -quiet \
            'engine/src/(core|audio_io|plugin|model)/.*\.cpp$'

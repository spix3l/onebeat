name: onebeat
description: "OneBeat — an open-source, pattern-based DAW for macOS."
publish_to: 'none'
version: 0.2.0+2

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.3
  # `@immutable` on the boundary value types. Declared explicitly rather than
  # leaned on transitively: engine_client.dart deliberately imports no Flutter
  # library, so it cannot reach the annotation through foundation.dart.
  meta: ^1.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  ffigen: ^19.1.0

flutter:
  uses-material-design: false

  # Bundled with their SIL OFL licences in third_party/fonts/ (OB-1-03 §1).
  # Both are variable fonts; weights are selected through the type tokens.
  fonts:
    - family: Archivo
      fonts:
        - asset: ../third_party/fonts/archivo/Archivo[wdth,wght].ttf
    - family: MartianMono
      fonts:
        - asset: ../third_party/fonts/martian_mono/MartianMono[wdth,wght].ttf

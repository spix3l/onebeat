# ffigen generates the Dart bindings from the C header. Hand-written bindings
# are forbidden (ADR-002 §1): the header is the single source of truth, and the
# generated file is checked in so that a clone builds without libclang.
#   cd app && dart run ffigen
name: OneBeatBindings
description: Generated bindings for the OneBeat engine ABI.
output: 'lib/src/engine/generated/onebeat_bindings.dart'
headers:
  entry-points:
    - '../engine/src/abi/onebeat_abi.h'
  include-directives:
    - '**onebeat_abi.h'
# ob_status crosses the boundary as a C enum, which is int on every ABI we
# target (arm64/x86-64 macOS); the freeze test in engine/tests/test_abi.cpp
# pins its size alongside every struct offset.
silence-enum-warning: true
compiler-opts:
  - '-I../engine/src'
preamble: |
  // GENERATED FILE - DO NOT EDIT.
  // Regenerate with: cd app && dart run ffigen
  // ignore_for_file: always_specify_types, camel_case_types, non_constant_identifier_names
  // ignore_for_file: unused_field, unused_element, constant_identifier_names, prefer_final_locals
  // ignore_for_file: require_trailing_commas, unnecessary_parenthesis, always_declare_return_types
  // coverage:ignore-file
